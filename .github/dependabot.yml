version: 2
updates:
  # Flutter/Dart-зависимости приложения
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # React-расширение
  - package-ecosystem: npm
    directory: /browser-extension
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Экшены в .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

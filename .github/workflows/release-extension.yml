name: Release Extension

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label (e.g. ext-1.3.1)'
        required: false
        default: 'manual'

jobs:
  build-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: browser-extension/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: browser-extension

      - name: Build extension
        run: npm run build
        working-directory: browser-extension

      - name: Package extension ZIP
        run: |
          TAG="${{ github.event.inputs.version || 'manual' }}"
          cd browser-extension
          zip -r "../ATControl-extension-${TAG}.zip" dist/

      - name: Create GitHub Release
        if: github.event.inputs.version != '' && github.event.inputs.version != 'manual'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: "ATControl Extension ${{ github.event.inputs.version }}"
          generate_release_notes: false
          body: "Браузерное расширение ATControl — новая вкладка"
          files: ATControl-extension-${{ github.event.inputs.version }}.zip

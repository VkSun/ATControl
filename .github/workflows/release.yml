name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label (e.g. v0.2.5)'
        required: false
        default: 'manual'
      build_extension:
        description: 'Build browser extension release'
        required: false
        default: 'false'

jobs:
  build-windows:
    if: ${{ github.event.inputs.build_extension != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 25
    outputs:
      artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build Windows
        # Пустые секреты не страшны: AppConfig подставит значения по умолчанию
        run: flutter build windows --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Extension
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cd browser-extension
          npm ci
          npm run build

      - name: Build Installer
        run: |
          $tag = "${{ github.event.inputs.version || github.ref_name }}"
          $version = $tag.TrimStart('v')
          $env:PATH = "C:\Program Files (x86)\Inno Setup 6;$env:PATH"
          Push-Location windows
          iscc /DMyAppVersion=$version installer.iss
          Pop-Location
          Move-Item "installer_output\ATControl-$version-setup.exe" "ATControl-$tag-setup.exe"

      - uses: actions/upload-artifact@v4.6.2
        id: upload-artifact
        with:
          name: windows-build
          path: ATControl-${{ github.event.inputs.version || github.ref_name }}-setup.exe

  sign-windows:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Sign installer with SignPath
        id: sign
        continue-on-error: true
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ secrets.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: 'ATCcontrol'
          signing-policy-slug: 'release-singing'
          artifact-configuration-slug: 'initial'
          github-artifact-id: '${{ needs.build-windows.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: './signed'

      - name: Upload signed build
        if: steps.sign.outcome == 'success'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: windows-build-signed
          path: ./signed/*.exe
          overwrite: true

      - name: Fallback - download unsigned build
        if: steps.sign.outcome == 'failure'
        uses: actions/download-artifact@v4.3.0
        with:
          name: windows-build
          path: ./unsigned

      - name: Fallback - upload unsigned as signed
        if: steps.sign.outcome == 'failure'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: windows-build-signed
          path: ./unsigned/*.exe
          overwrite: true

  build-android:
    if: ${{ github.event.inputs.build_extension != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-java@v4.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/build.gradle', 'android/app/build.gradle') }}
          restore-keys: gradle-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
            echo "Keystore decoded successfully"
          else
            echo "No keystore secret found, using debug signing"
          fi

      - name: Build Android APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: flutter build apk --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             ATControl-${{ github.event.inputs.version || github.ref_name }}-android.apk

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: android-build
          path: ATControl-${{ github.event.inputs.version || github.ref_name }}-android.apk

  build-extension:
    if: ${{ github.event.inputs.build_extension == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build Extension
        working-directory: browser-extension
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run build

      - name: Package ZIP
        run: |
          VERSION="${{ github.event.inputs.version || 'v1.0.0' }}"
          cd browser-extension
          zip -r "../atcontrol-newtab-${VERSION}.zip" dist/
          echo "ZIP_NAME=atcontrol-newtab-${VERSION}.zip" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: newtab-${{ env.VERSION }}
          name: "ATControl New Tab Extension ${{ env.VERSION }}"
          generate_release_notes: false
          body: |
            ## ATControl — Расширение для браузера (Новая вкладка)

            Chrome/Chromium расширение, заменяющее новую вкладку дашбордом ATControl.

            ### Установка
            1. Скачайте и распакуйте `${{ env.ZIP_NAME }}`
            2. Откройте `chrome://extensions`
            3. Включите **«Режим разработчика»** (переключатель вверху справа)
            4. Нажмите **«Загрузить распакованное расширение»**
            5. Выберите папку `dist/` из распакованного архива
          files: ${{ env.ZIP_NAME }}

  release:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' && github.event.inputs.version != 'manual' && github.event.inputs.build_extension != 'true')
    needs: [sign-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          name: windows-build-signed

      - uses: actions/download-artifact@v4.3.0
        with:
          name: android-build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          # Без этого workflow_dispatch создаёт тег на HEAD дефолтной ветки,
          # а не на собранном коммите
          target_commitish: ${{ github.sha }}
          name: "ATControl ${{ github.event.inputs.version || github.ref_name }}"
          generate_release_notes: true
          files: |
            ATControl-${{ github.event.inputs.version || github.ref_name }}-setup.exe
            ATControl-${{ github.event.inputs.version || github.ref_name }}-android.apk

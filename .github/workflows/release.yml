name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label (e.g. v0.2.5)'
        required: false
        default: 'manual'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows ZIP
        run: |
          $tag = "${{ github.event.inputs.version || github.ref_name }}"
          $name = "ATControl-$tag-windows"
          Copy-Item -Recurse "build\windows\x64\runner\Release" $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: windows-build
          path: ATControl-${{ github.event.inputs.version || github.ref_name }}-windows.zip

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-java@v4.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/build.gradle', 'android/app/build.gradle') }}
          restore-keys: gradle-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
            echo "Keystore decoded successfully"
          else
            echo "No keystore secret found, using debug signing"
          fi

      - name: Build Android APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             ATControl-${{ github.event.inputs.version || github.ref_name }}-android.apk

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: android-build
          path: ATControl-${{ github.event.inputs.version || github.ref_name }}-android.apk

  release:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' && github.event.inputs.version != 'manual')
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          name: windows-build

      - uses: actions/download-artifact@v4.3.0
        with:
          name: android-build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: "ATControl ${{ github.event.inputs.version || github.ref_name }}"
          generate_release_notes: true
          files: |
            ATControl-${{ github.event.inputs.version || github.ref_name }}-windows.zip
            ATControl-${{ github.event.inputs.version || github.ref_name }}-android.apk

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows ZIP
        run: |
          $tag = "${{ github.ref_name }}"
          $name = "ATControl-$tag-windows"
          Copy-Item -Recurse "build\windows\x64\runner\Release" $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: windows-build
          path: ATControl-${{ github.ref_name }}-windows.zip

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-java@v4.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             ATControl-${{ github.ref_name }}-android.apk

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: android-build
          path: ATControl-${{ github.ref_name }}-android.apk

  release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          name: windows-build

      - uses: actions/download-artifact@v4.3.0
        with:
          name: android-build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ATControl ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            ATControl-${{ github.ref_name }}-windows.zip
            ATControl-${{ github.ref_name }}-android.apk


name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label (e.g. v0.2.5)'
        required: false
        default: 'manual'
      build_extension:
        description: 'Build browser extension release'
        required: false
        default: 'false'

jobs:
  build-windows:
    if: ${{ github.event.inputs.build_extension != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows ZIP
        run: |
          $tag = "${{ github.event.inputs.version || github.ref_name }}"
          $name = "ATControl-$tag-windows"
          Copy-Item -Recurse "build\windows\x64\runner\Release" $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: windows-build
          path: ATControl-${{ github.event.inputs.version || github.ref_name }}-windows.zip

  build-android:
    if: ${{ github.event.inputs.build_extension != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-java@v4.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/build.gradle', 'android/app/build.gradle') }}
          restore-keys: gradle-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             ATControl-${{ github.event.inputs.version || github.ref_name }}-android.apk

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: android-build
          path: ATControl-${{ github.event.inputs.version || github.ref_name }}-android.apk

  build-extension:
    if: ${{ github.event.inputs.build_extension == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: claude/admin-panel-theme-variants-qgh57y

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build Extension
        working-directory: browser-extension
        run: |
          npm ci
          npm run build

      - name: Package ZIP
        run: |
          VERSION="${{ github.event.inputs.version || 'v1.0.0' }}"
          cd browser-extension
          zip -r "../atcontrol-newtab-${VERSION}.zip" dist/
          echo "ZIP_NAME=atcontrol-newtab-${VERSION}.zip" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: newtab-${{ env.VERSION }}
          name: "ATControl New Tab Extension ${{ env.VERSION }}"
          generate_release_notes: false
          body: |
            ## ATControl — Расширение для браузера (Новая вкладка)

            Chrome/Chromium расширение, заменяющее новую вкладку дашбордом в стиле Mazer с синхронизацией задач ATControl.

            ### Установка
            1. Скачайте и распакуйте `${{ env.ZIP_NAME }}`
            2. Откройте `chrome://extensions`
            3. Включите **«Режим разработчика»** (переключатель вверху справа)
            4. Нажмите **«Загрузить распакованное расширение»**
            5. Выберите папку `dist/` из распакованного архива

            ### Возможности
            - 🔑 Авторизация через Supabase (тот же аккаунт что в ATControl)
            - ✅ Синхронизация задач с ATControl
            - 🕐 Живые часы
            - 🔍 Поиск (Google, Яндекс, DuckDuckGo, Bing)
            - 🌤 Виджет погоды
            - 🔖 Закладки
            - 📅 Календарь
          files: ${{ env.ZIP_NAME }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          name: windows-build

      - uses: actions/download-artifact@v4.3.0
        with:
          name: android-build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ATControl ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            ATControl-${{ github.ref_name }}-windows.zip
            ATControl-${{ github.ref_name }}-android.apk

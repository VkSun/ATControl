name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Package release
        run: |
          $tag = "${{ github.ref_name }}"
          $name = "ATControl-$tag-windows"
          Copy-Item -Recurse "build\windows\x64\runner\Release" $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          echo "ASSET_NAME=$name.zip" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ATControl ${{ github.ref_name }}"
          generate_release_notes: true
          files: ${{ env.ASSET_NAME }}

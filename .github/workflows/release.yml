name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label (e.g. v0.2.5)'
        required: false
        default: 'manual'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    outputs:
      artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Extension
        run: |
          cd browser-extension
          npm ci
          npm run build

      - name: Build Installer
        run: |
          $tag = "${{ github.event.inputs.version || github.ref_name }}"
          $version = $tag.TrimStart('v')
          $env:PATH = "C:\Program Files (x86)\Inno Setup 6;$env:PATH"
          Push-Location windows
          iscc /DMyAppVersion=$version installer.iss
          Pop-Location
          Move-Item "installer_output\ATControl-$version-setup.exe" "ATControl-$tag-setup.exe"

      - uses: actions/upload-artifact@v4.6.2
        id: upload-artifact
        with:
          name: windows-build
          path: ATControl-${{ github.event.inputs.version || github.ref_name }}-setup.exe

  sign-windows:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Sign installer with SignPath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ secrets.SIGNPATH_ORGANIZATION_ID }}'
          signing-policy-slug: 'release-singing'
          artifact-configuration-slug: 'initial'
          github-artifact-id: '${{ needs.build-windows.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: './signed'

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: windows-build-signed
          path: ./signed/*.exe
          overwrite: true

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-java@v4.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/build.gradle', 'android/app/build.gradle') }}
          restore-keys: gradle-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
            echo "Keystore decoded successfully"
          else
            echo "No keystore secret found, using debug signing"
          fi

      - name: Build Android APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             ATControl-${{ github.event.inputs.version || github.ref_name }}-android.apk

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: android-build
          path: ATControl-${{ github.event.inputs.version || github.ref_name }}-android.apk

  release:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' && github.event.inputs.version != 'manual')
    needs: [sign-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          name: windows-build-signed

      - uses: actions/download-artifact@v4.3.0
        with:
          name: android-build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: "ATControl ${{ github.event.inputs.version || github.ref_name }}"
          generate_release_notes: true
          files: |
            ATControl-${{ github.event.inputs.version || github.ref_name }}-setup.exe
            ATControl-${{ github.event.inputs.version || github.ref_name }}-android.apk

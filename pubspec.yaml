name: atcontrol
description: Система управления автопарком ATControl
publish_to: 'none'
version: 0.4.0+19

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # База данных Supabase
  supabase_flutter: ^2.3.0
  
  # Навигация
  go_router: ^13.0.0
  
  # Управление состоянием
  riverpod: ^2.5.0
  flutter_riverpod: ^2.5.0
  
  # Иконки
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  
  # Аннотации (@visibleForTesting)
  meta: ^1.10.0

  # Работа с датами
  intl: ^0.20.0
  
  # Excel импорт/экспорт
  syncfusion_flutter_xlsio: ^29.2.11
  open_file: ^3.3.2
  path_provider: ^2.1.2
  excel: ^4.0.6
  file_picker: ^8.1.7
  archive: ^3.6.1
  xml: ^6.6.1
  
  # Погода / обновления
  http: ^1.2.0
  url_launcher: ^6.3.0

  package_info_plus: ^8.0.0

  # Уведомления ОС
  flutter_local_notifications: ^18.0.1

  # Автозагрузка (Windows/macOS)
  launch_at_startup: ^0.5.1

  # Управление окном и системный трей (Windows)
  window_manager: ^0.4.3
  tray_manager: ^0.2.3

  # Постоянное хранение настроек
  shared_preferences: ^2.3.0
  local_notifier: ^0.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/app_icon.ico